name: Release xsai Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Cross-Platform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build All Architectures
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DIST_DIR="dist"
          mkdir -p "${DIST_DIR}"

          cd x-spider-ai || cd .

          TARGETS=(
            "windows/amd64/.exe"
            "windows/arm64/.exe"
            "linux/amd64/"
            "linux/arm64/"
            "darwin/amd64/"
            "darwin/arm64/"
          )

          for target in "${TARGETS[@]}"; do
            IFS="/" read -r OS ARCH EXT <<< "$target"
            OUT_NAME="xsai-${VERSION}-${OS}-${ARCH}${EXT}"
            OUT_PATH="../${DIST_DIR}/${OUT_NAME}"

            echo "Building ${OUT_NAME}..."
            GOOS="${OS}" GOARCH="${ARCH}" CGO_ENABLED=0 go build \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${BUILD_DATE}" \
              -o "${OUT_PATH}" ./cmd/x-spider-ai

            sha256sum "${OUT_PATH}" | awk '{print $1}' > "${OUT_PATH}.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "xsai ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
